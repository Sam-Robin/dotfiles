# Prefix is Ctrl-a: the default Ctrl-b is nvim's explorer toggle.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ",*:RGB"
set -sg escape-time 0          # nvim: Esc must not wait for a meta sequence
set -g focus-events on         # nvim: autoread and claudecode selection tracking
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g window-status-current-style "fg=#7aa2f7,bold"
set -g status-left " #S "
set -g status-left-length 40
set -g status-right ""

bind r source-file ~/.tmux.conf \; display "reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Ctrl-h/j/k/l move between panes, and hand the key to nvim when the pane is
# running it so smart-splits.nvim can move inside nvim first. Mirror of
# ~/.config/nvim/lua/plugins/navigation.lua. Ctrl-l no longer clears a shell
# pane; use `clear`.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
